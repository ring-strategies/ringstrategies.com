<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet" />

<style>
  :root {
    --paper:  #ffffff;
    --rule:   #e7e7e8;
    --graphite: #55565a;
    --ink:    #0b0b0c;
    --serif: "Newsreader", Georgia, "Times New Roman", serif;
    --gutter: clamp(1.25rem, 5vw, 3.5rem);
    --ease: cubic-bezier(0.2, 0.65, 0.2, 1);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html {
    -webkit-text-size-adjust: 100%;
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    font-optical-sizing: auto;
    font-size: clamp(1.05rem, 0.62rem + 0.9vw, 1.2rem);
    line-height: 1.72;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-feature-settings: "kern", "liga", "onum";
  }

  ::selection { background: var(--ink); color: var(--paper); }
  a { color: inherit; text-decoration: none; }

  .frame {
    position: sticky;
    top: 0;
    z-index: 20;
    background: color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter: saturate(160%) blur(8px);
    border-bottom: 1px solid transparent;
    transition: border-color .3s var(--ease);
  }
  .frame.is-scrolled { border-bottom-color: var(--rule); }
  .frame__row {
    max-width: 1180px;
    margin: 0 auto;
    padding: 0.95rem var(--gutter);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1.5rem;
  }
  .wordmark {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 1.02rem;
    letter-spacing: 0.005em;
    color: var(--ink);
    white-space: nowrap;
  }
  .wordmark span { color: var(--graphite); font-weight: 400; }
  .frame__nav { display: flex; gap: 1.6rem; }
  .frame__nav a {
    position: relative;
    transition: color .2s var(--ease);
  }
  .frame__nav a::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -0.28rem;
    height: 1px;
    background: currentColor;
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .25s var(--ease);
  }
  .frame__nav a:hover { color: var(--ink); }
  .frame__nav a:hover::after { transform: scaleX(1); }

  :focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header class="frame" id="frame">
  <div class="frame__row">
    <a class="wordmark" href="#thesis">Ring Strategies <span>/ Chicago</span></a>
    <nav class="frame__nav">
      <a href="mailto:contact@ringstrategies.com">contact@ringstrategies.com</a>
    </nav>
  </div>
</header>

</body>
</html>
